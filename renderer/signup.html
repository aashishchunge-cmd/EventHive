<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EventHive - Create Account</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                📅
            </div>

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Join EventHive today
            </p>


            <form id="signupForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="signupBtn"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <p
                id="message"
                class="message"
            ></p>


            <div class="auth-footer">

                <p>
                    Already have an account?
                </p>

                <a href="login.html">
                    Sign In
                </a>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/signup.js"></script>

</body>

</html>
